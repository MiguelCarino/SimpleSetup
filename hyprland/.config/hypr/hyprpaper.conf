# hyprpaper -- the wallpaper. Started from lua/autostart.lua.
#
# $HOME below is expanded by lua/autostart.lua when the session starts
# (hyprpaper itself only takes absolute paths). Any other path must be absolute.
#
# An empty monitor = puts the image on every screen. To give one screen its own
# image, add a second block with its name (`hyprctl monitors` prints names).
# The image is scaled to cover and centre-cropped, so any aspect ratio works.

wallpaper {
    monitor  =
    path     = $HOME/Pictures/Wallpapers/carino.png
    fit_mode = cover
}

splash = false
ipc = on
