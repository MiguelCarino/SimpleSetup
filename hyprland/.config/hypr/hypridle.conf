# hypridle -- idle timings. Started from lua/autostart.lua.
#
# Now:  lock after 10 min idle, screens off 30 s after any lock.
# Nothing suspends on its own here; add a listener with
# `on-timeout = systemctl suspend` if you want that.
#
# lock_cmd uses pidof as a guard so a second trigger cannot stack a second
# hyprlock on top of the first.
#
# before_sleep_cmd locks *before* suspend rather than after, so the machine is
# never briefly unlocked while it wakes. after_sleep_cmd turns the displays
# back on: waking does not implicitly undo a DPMS off.
#
# Every dispatch is Lua because this config is Lua -- the classic
# `hyprctl dispatch dpms off` form is a syntax error with it.
#
# Things that hold all of this off: a fullscreen window and Steam games
# (idle_inhibit rules in lua/rules.lua), and browsers and mpv while they play.

general {
    # No --grace here. lock_cmd is what `loginctl lock-session` runs, and
    # before_sleep_cmd goes through it too: with a grace period on this line,
    # the lock taken just before suspend could still be inside its grace
    # window on wake, so touching the mouse would unlock with no password.
    # The grace period is for idle locks only -- see the lock listener.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ on = true })'
}

# Screens off 30 s after ANY lock -- by hand (SUPER+ALT+L, the power menu) or
# the idle lock. hypridle timeouts count idle time from the last input and each
# fires once per idle stretch: the key press that locked resets the clock, so
# 30 s later the screens go dark, but only if hyprlock is actually up
# (pidof); unlocked, 30 s idle does nothing. The idle lock gets a listener of
# its own at the end, because this one has already fired by then.
listener {
    timeout = 30
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ on = false })'
    # Guarded like on-timeout. Unguarded, every short idle stretch while
    # UNLOCKED would end with a dpms-on to screens that are already on, which
    # on some GPUs is a full modeset (a black flash on the first mouse move).
    # Input wakes the screens anyway (*_enables_dpms in lua/settings.lua).
    on-resume = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ on = true })'
}

# 10 min: lock.
# --grace 3: any input in the first 3 seconds after an idle lock unlocks
# without a password, so nudging the mouse as the lock fades in does not
# cost you a login.
# Calls hyprlock directly rather than going through loginctl, so that only this
# path gets the grace period (lock_cmd above is shared with sleep). SUPER+ALT+L
# runs plain hyprlock and locks at once.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock --grace 3
}

# 10 min 30 s: screens off after the idle lock (the 30 s listener above has
# already fired by then, so the idle lock needs one of its own).
listener {
    timeout = 630
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ on = false })'
    on-resume = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ on = true })'
}
