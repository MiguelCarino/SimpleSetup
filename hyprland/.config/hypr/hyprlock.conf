# hyprlock -- the lock screen. Called by SUPER+ALT+L (lua/binds.lua) and by
# hypridle's lock_cmd at 10 minutes idle.
#
# Layout: every screen shows a blurred, dimmed copy of what it had on it. The
# password field, clock and date are on every screen (empty monitor =); to
# keep them on one, put its name after `monitor =` (`hyprctl monitors`).
#
# NEON theme, matching waybar, wofi and mako: Orbitron for the clock,
# Rajdhani for text, Share Tech Mono for the password dots (all three are in
# ~/.local/share/fonts/carino/). Cyan is the main
# neon, magenta the second; labels glow via shadow_* (a zero-offset coloured
# shadow is a glow).
#
# Clearing a mistyped password: ESC, Ctrl+U or Ctrl+Backspace.

$font_display = Orbitron
$font_text    = Rajdhani SemiBold
$font_mono    = Share Tech Mono

general {
    hide_cursor = true
    # No grace period here: in this hyprlock it is a CLI flag (--grace), not a
    # config key. hypridle passes it for idle locks only -- see hypridle.conf.
    # Enter on an empty field does nothing instead of counting as a failed try.
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

# One background block for every output (empty monitor =). path = screenshot
# freezes what was on screen at lock time and the blur makes it unreadable.
# brightness keeps white text legible over a bright browser page.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    contrast = 1.1
    vibrancy = 0.25
}

input-field {
    monitor =
    size = 380, 54
    outline_thickness = 2
    rounding = 4
    inner_color = rgba(6, 8, 16, 0.85)
    outer_color = rgb(00f0ff) rgb(ff2a6d) 135deg
    check_color = rgb(f9f002) rgb(00f0ff) 120deg
    fail_color  = rgb(ff2a6d) rgb(b026ff) 40deg
    capslock_color = rgb(f9f002)
    font_color = rgb(0, 240, 255)
    font_family = $font_mono
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 240, 255, 0.45)
    fade_on_empty = false
    placeholder_text = <span foreground="##00f0ff" fgalpha="55%">ENTER PASSWORD_</span>
    fail_text = <b>$FAIL</b> ($ATTEMPTS)
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 100
    font_family = $font_display
    color = rgb(0, 240, 255)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 240, 255, 0.6)
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A // %d %B" | tr a-z A-Z
    font_size = 22
    font_family = $font_text
    color = rgb(255, 42, 109)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(255, 42, 109, 0.55)
    position = 0, 120
    halign = center
    valign = center
}

# Active xkb layout, under the field. With two layouts a few symbols move, so
# a password that "suddenly stopped working" is almost always this. SUPER+Space
# switches layout while locked, same as everywhere else.
label {
    monitor =
    text = $LAYOUT
    font_size = 14
    font_family = $font_mono
    color = rgba(0, 240, 255, 0.6)
    position = 0, -100
    halign = center
    valign = center
}
