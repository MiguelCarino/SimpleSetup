# ~/.config/themes/cyberpunk/theme.conf -- the Carino neon look.
#
# lua/display.lua reads the hypr.* keys and anim= at every config load
# (`hyprctl reload` after an edit) and lua/env.lua reads cursor_theme= if
# you add one. The term.* keys are what ~/.config/kitty/theme.conf was made
# from. key=value, # starts a comment.

name=Cyberpunk
order=10
# The root of every inherit= chain.
inherit=

# --- Accent ------------------------------------------------------------------
# Empty: the stylesheets' own @cyan (#00f0ff). accent= in display.conf may replace it.
accent=
accent_follow=yes

# --- Fonts -------------------------------------------------------------------
font=IBM Plex Sans
font_mono=IBM Plex Mono

# --- Hyprland look (lua/display.lua applies these at every config load) ------
hypr.rounding=4
hypr.gaps_in=3
hypr.gaps_out=4
hypr.border_size=4
# Hyprland gradient syntax: colours, then the angle.
hypr.active_border=rgb(0ff0fc) rgb(00fff7) rgb(39ff14) rgb(fffb00) rgb(ff0055) rgb(9f00ff) 135deg
hypr.inactive_border=rgba(00f0ff33) rgba(ff2a6d26) 135deg
# The wallpaper accent takes these active_border stops (1-based): the two
# cyan ones. Empty = the border never follows the accent.
hypr.accent_stops=1 2
hypr.blur=yes
hypr.blur_size=6
hypr.blur_passes=4
hypr.blur_brightness=0.80
hypr.blur_contrast=1.10
hypr.blur_vibrancy=0.30
hypr.blur_vibrancy_darkness=0.30
hypr.blur_noise=0.012
hypr.shadow=no
hypr.shadow_range=14
hypr.shadow_render_power=3
hypr.shadow_color=rgba(00f0ff55)

# Animation preset (snappy smooth fancy calm); anim= in
# ~/.local/state/hypr/display.conf wins over it.
anim=fancy

# --- Terminals (kitty) --------------------------------------------------------
# The bar's neon on near-black glass. Contrast is measured against the WORST
# case, the brightest blurred wallpaper (~#adadad) right behind the glass:
# at glass=12 every normal colour >= 4.6:1 there, the text 15.9:1. ANSI
# order: black red green yellow blue magenta cyan white.
term.font=IBM Plex Mono
# How see-through the terminals are, 0-100 (kitty: background_opacity 0.88).
glass=12
term.font_size=14

term.background=#07090f
term.foreground=#e6fcff
term.cursor=#00f0ff
term.normal=#1b1f2a #ff2a6d #39ff14 #f9f002 #5c8dff #c060ff #00f0ff #c8d3e6
term.bright=#5a6478 #ff6b96 #8aff70 #fff86b #8fb0ff #d890ff #8af8ff #ffffff
