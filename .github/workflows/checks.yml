name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, shellcheck, family detection for every distribution, plans, purposes, desktops, arguments and package tables (all dry runs)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          ./test.sh --network   # --network also asks Flathub about every Flatpak id
      - name: Every package array in setup.sh names a known family
        run: ./tools/check-packages.sh coverage   # text only and instant
      - name: shellcheck
        run: |
          shellcheck -S warning setup.sh test.sh tools/check-packages.sh
          shellcheck -S error macos.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse, cmdlet resolution and menu parity
        shell: pwsh
        run: ./test.ps1
      - name: Same checks under Windows PowerShell 5.1
        shell: powershell
        run: ./test.ps1   # 5.1 is what ships on a stock Windows box and is what actually runs setup.ps1, pwsh alone would not catch a 7-only construct
