name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax, menu parity, install command shape, every argument, every plan directive and a dry run of every supported distribution
        run: ./test.sh --network   # --network also verifies the published URLs and every Flathub identifier, which is what caught the 404 install command
      - name: Every package list in setup.sh is watched by a leg of the package check
        run: ./tools/check-packages.sh coverage   # text only and instant, and it is the one check that notices a brand new package list nothing is looking at, which is how the RPM family desktop lists went unwatched
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error setup.sh macos.sh test.sh tools/check-packages.sh   # errors only, this codebase predates shellcheck and the warning-level backlog would drown the signal

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse, cmdlet resolution and menu parity
        shell: pwsh
        run: ./test.ps1
      - name: Same checks under Windows PowerShell 5.1
        shell: powershell
        run: ./test.ps1   # 5.1 is what ships on a stock Windows box and is what actually runs setup.ps1, pwsh alone would not catch a 7-only construct
