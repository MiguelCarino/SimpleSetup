name: package names

on:
  schedule:
    - cron: "0 6 1 * *"   # the first of each month, package renames are slow and a monthly report is enough to catch them before a user does
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every package name still resolves upstream
        run: ./tools/check-packages.sh all
      - name: Open an issue when a name has gone
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Package names no longer resolve'
            const body = 'The monthly package check failed. See the run log for the names: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'packages' })
            if (open.data.some(i => i.title === title)) return   // one open issue at a time, a monthly cron would otherwise file twelve a year for the same rename
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['packages'] })
